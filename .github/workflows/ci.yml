name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - name: Run tests and publish Windows failure details
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testOutput = & npm test -- --test-reporter=spec 2>&1
          $testExitCode = $LASTEXITCODE
          $testOutput | Write-Output
          if ($testExitCode -ne 0) {
            @('### Windows test output', '', '~~~text') + @($testOutput) + @('~~~') | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          exit $testExitCode
      - name: Run tests
        if: runner.os != 'Windows'
        run: npm test

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm audit
